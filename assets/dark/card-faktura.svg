<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="249" viewBox="0 0 560 249" role="img" aria-label="Faktura: Invoicing monorepo">
  <defs>
    <clipPath id="r"><rect x="1" y="1" width="558" height="233" rx="6"/></clipPath>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2F2F2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F2F2F2"/>
      <stop offset="1" stop-color="#F2F2F2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="558" height="233" rx="6" fill="#F2F2F2" fill-opacity="0.03" stroke="#F2F2F2" stroke-opacity="0.25" stroke-width="1.2"/>
  <g clip-path="url(#r)">
    <rect x="0" y="1" width="220" height="2" fill="url(#g)">
      <animateTransform attributeName="transform" type="translate" from="-220 0" to="560 0" dur="5s" begin="0.7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="24" y="44" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#F2F2F2">Faktura</text>
  <text x="24" y="66" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#A3A3A3">INVOICING MONOREPO</text>
  <text x="536" y="40" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#A3A3A3">02</text>
  <text x="24" y="100" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#C8C8C8"><tspan x="24" dy="0">NestJS 11 + Prisma 8 API and a Next.js 16 client in a pnpm</tspan><tspan x="24" dy="21">monorepo. Argon2 + Google OAuth (Passport), Radix UI +</tspan><tspan x="24" dy="21">TanStack on the front, Resend for email. Built to ship</tspan><tspan x="24" dy="21">serverless on Neon.</tspan></text>
  <rect x="24" y="189" width="61" height="24" rx="3" fill="#F2F2F2" fill-opacity="0.07" stroke="#F2F2F2" stroke-opacity="0.28"/><text x="54.5" y="205" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#F2F2F2">NestJS</text><rect x="93" y="189" width="69" height="24" rx="3" fill="#F2F2F2" fill-opacity="0.07" stroke="#F2F2F2" stroke-opacity="0.28"/><text x="127.5" y="205" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#F2F2F2">Next.js</text><rect x="170" y="189" width="61" height="24" rx="3" fill="#F2F2F2" fill-opacity="0.07" stroke="#F2F2F2" stroke-opacity="0.28"/><text x="200.5" y="205" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#F2F2F2">Prisma</text><rect x="239" y="189" width="47" height="24" rx="3" fill="#F2F2F2" fill-opacity="0.07" stroke="#F2F2F2" stroke-opacity="0.28"/><text x="262.5" y="205" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#F2F2F2">pnpm</text>
  <text x="536" y="207" text-anchor="end" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#F2F2F2">↗
    <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
  </text>
</svg>
