<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="249" viewBox="0 0 560 249" role="img" aria-label="Avunel: A multi-agent AI assistant">
  <defs>
    <clipPath id="r"><rect x="1" y="1" width="558" height="233" rx="6"/></clipPath>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2F2F2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F2F2F2"/>
      <stop offset="1" stop-color="#F2F2F2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="558" height="233" rx="6" fill="#F2F2F2" fill-opacity="0.03" stroke="#F2F2F2" stroke-opacity="0.25" stroke-width="1.2"/>
  <g clip-path="url(#r)">
    <rect x="0" y="1" width="220" height="2" fill="url(#g)">
      <animateTransform attributeName="transform" type="translate" from="-220 0" to="560 0" dur="5s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="24" y="44" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#F2F2F2">Avunel</text>
  <text x="24" y="66" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#A3A3A3">A MULTI-AGENT AI ASSISTANT</text>
  <text x="536" y="40" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#A3A3A3">01</text>
  <text x="24" y="100" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#C8C8C8"><tspan x="24" dy="0">Python CLI for orchestrating AI agents with skills, plugins,</tspan><tspan x="24" dy="21">scheduled jobs, and conversation memory. Cross-platform (bash,</tspan><tspan x="24" dy="21">fish, PowerShell).</tspan></text>
  <rect x="24" y="189" width="61" height="24" rx="3" fill="#F2F2F2" fill-opacity="0.07" stroke="#F2F2F2" stroke-opacity="0.28"/><text x="54.5" y="205" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#F2F2F2">Python</text><rect x="93" y="189" width="39" height="24" rx="3" fill="#F2F2F2" fill-opacity="0.07" stroke="#F2F2F2" stroke-opacity="0.28"/><text x="112.5" y="205" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#F2F2F2">CLI</text><rect x="140" y="189" width="83" height="24" rx="3" fill="#F2F2F2" fill-opacity="0.07" stroke="#F2F2F2" stroke-opacity="0.28"/><text x="181.5" y="205" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#F2F2F2">AI agents</text>
  <text x="536" y="207" text-anchor="end" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#F2F2F2">↗
    <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
  </text>
</svg>
