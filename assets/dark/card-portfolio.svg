  <text x="536" y="40" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#A3A3A3">04</text>
  <text x="24" y="100" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#C8C8C8"><tspan x="24" dy="0">Next.js 16 App Router with all content in JSON files at build</tspan><tspan x="24" dy="21">time, so adding a project is a single commit. Contact form</tspan><tspan x="24" dy="21">uses Resend and Upstash Redis for per-IP rate limiting.</tspan></text>
  <rect x="24" y="189" width="91" height="24" rx="3" fill="#F2F2F2" fill-opacity="0.07" stroke="#F2F2F2" stroke-opacity="0.28"/><text x="69.5" y="205" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#F2F2F2">Next.js 16</text><rect x="123" y="189" width="61" height="24" rx="3" fill="#F2F2F2" fill-opacity="0.07" stroke="#F2F2F2" stroke-opacity="0.28"/><text x="153.5" y="205" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#F2F2F2">Resend</text><rect x="192" y="189" width="69" height="24" rx="3" fill="#F2F2F2" fill-opacity="0.07" stroke="#F2F2F2" stroke-opacity="0.28"/><text x="226.5" y="205" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#F2F2F2">Upstash</text>
