<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6A89C4" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#6A89C4"/>
      <stop offset="0.55" stop-color="#A85A6C"/>
      <stop offset="1" stop-color="#A85A6C" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="line"><rect x="100" y="0" width="1000" height="24"/></clipPath>
  </defs>
  <line x1="100" y1="12" x2="1100" y2="12" stroke="#9DB4DD" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round"/>
  <g clip-path="url(#line)">
    <rect x="0" y="11" width="280" height="2" rx="1" fill="url(#glow)">
      <animateTransform attributeName="transform" type="translate" from="-280 0" to="1200 0" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(600 12) rotate(45)">
    <rect x="-5" y="-5" width="10" height="10" rx="1.5" fill="#A85A6C">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="574" cy="12" r="2" fill="#6A89C4" opacity="0.7"/>
  <circle cx="626" cy="12" r="2" fill="#6A89C4" opacity="0.7"/>
</svg>
