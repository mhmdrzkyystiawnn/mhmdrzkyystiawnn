<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="presentation">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111111" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#111111"/>
      <stop offset="1" stop-color="#111111" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="line"><rect x="100" y="0" width="1000" height="24"/></clipPath>
  </defs>
  <line x1="100" y1="12" x2="1100" y2="12" stroke="#6B6B6B" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
  <g clip-path="url(#line)">
    <rect x="0" y="11" width="280" height="2" rx="1" fill="url(#glow)">
      <animateTransform attributeName="transform" type="translate" from="-280 0" to="1200 0" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(600 12) rotate(45)">
    <rect x="-5" y="-5" width="10" height="10" rx="1.5" fill="#111111">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="574" cy="12" r="2" fill="#6B6B6B"/>
  <circle cx="626" cy="12" r="2" fill="#6B6B6B"/>
</svg>
